<svg xmlns="http://www.w3.org/2000/svg" width="1499" height="1049" viewBox="0 0 1499 1049">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1d1d1b" flood-opacity="0.16"/>
    </filter>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1d1d1b" flood-opacity="0.13"/>
    </filter>
    <style>
      .ink { fill: #1d1d1b; }
      .muted { fill: #5f5b53; }
      .paper { fill: #f5f1e8; }
      .serif { font-family: 'Noto Serif', Georgia, serif; }
      .sans { font-family: 'Noto Sans', Arial, sans-serif; }
    </style>
  </defs>

  <!-- Editorial copy panel: the photo remains the full-bleed base layer underneath. -->
  <rect x="36" y="124" width="415" height="527" rx="20" fill="#1d1d1b" fill-opacity="0.12"/>
  <rect x="42" y="116" width="415" height="527" rx="20" fill="#f5f1e8" fill-opacity="0.96" stroke="#e9e3d7" stroke-width="2"/>
  <rect x="72" y="154" width="116" height="10" rx="2" fill="#f2c94c"/>

  <text x="72" y="225" class="serif ink" font-size="47" font-weight="700" letter-spacing="-1.35">GJØR GAMLE</text>
  <text x="72" y="278" class="serif ink" font-size="47" font-weight="700" letter-spacing="-1.35">SKJERMER TIL</text>
  <text x="72" y="331" class="serif ink" font-size="47" font-weight="700" letter-spacing="-1.35">VÆRSKILT</text>

  <text x="72" y="420" class="serif ink" font-size="22" letter-spacing="-0.2">
    <tspan x="72" dy="0">Gjenbruk gamle e-lesere,</tspan>
    <tspan x="72" dy="31">nettbrett og telefoner som</tspan>
    <tspan x="72" dy="31">nyttige, energieffektive</tspan>
    <tspan x="72" dy="31">skilt ved døren.</tspan>
  </text>

  <!-- QR card: the exact QR bitmap is composited after this overlay is rendered. -->
  <rect x="1190" y="34" width="280" height="314" rx="18" fill="#1d1d1b" fill-opacity="0.12"/>
  <rect x="1190" y="28" width="280" height="314" rx="18" fill="#f5f1e8" fill-opacity="0.98" stroke="#1d1d1b" stroke-width="2"/>
  <rect x="1220" y="51" width="220" height="220" fill="#ffffff"/>
  <text x="1330" y="310" class="sans ink" font-size="21" font-weight="700" text-anchor="middle">arhp.no/umbrella</text>

  <!-- Bottom information band. -->
  <rect x="42" y="852" width="1416" height="149" rx="20" fill="#1d1d1b" fill-opacity="0.12"/>
  <rect x="42" y="846" width="1416" height="149" rx="20" fill="#f5f1e8" fill-opacity="0.95" stroke="#e9e3d7" stroke-width="2"/>

  <!-- Small device family mark. -->
  <g transform="translate(78 870)" stroke="#1d1d1b" stroke-width="5" stroke-linejoin="round">
    <rect x="0" y="0" width="68" height="101" rx="8" fill="#f2c94c"/>
    <rect x="11" y="11" width="46" height="72" rx="2" fill="#f5f1e8"/>
    <circle cx="34" cy="91" r="3" fill="#1d1d1b" stroke="none"/>
    <rect x="78" y="31" width="40" height="70" rx="7" fill="#f2c94c"/>
    <rect x="85" y="39" width="26" height="47" rx="1" fill="#f5f1e8"/>
    <circle cx="98" cy="93" r="2.5" fill="#1d1d1b" stroke="none"/>
    <rect x="130" y="14" width="66" height="87" rx="5" fill="#f2c94c"/>
    <rect x="140" y="25" width="46" height="56" rx="1" fill="#f5f1e8"/>
    <path d="M148 39h30M148 52h30M148 65h30" fill="none"/>
    <circle cx="163" cy="91" r="3" fill="#1d1d1b" stroke="none"/>
  </g>

  <line x1="287" y1="869" x2="287" y2="972" stroke="#1d1d1b" stroke-opacity="0.65" stroke-width="2"/>
  <line x1="643" y1="869" x2="643" y2="972" stroke="#1d1d1b" stroke-opacity="0.65" stroke-width="2"/>
  <line x1="1065" y1="869" x2="1065" y2="972" stroke="#1d1d1b" stroke-opacity="0.65" stroke-width="2"/>

  <text x="315" y="888" class="sans ink" font-size="23" font-weight="800" letter-spacing="1.1">PLATTFORMUAVHENGIG</text>
  <text x="315" y="924" class="sans muted" font-size="21" letter-spacing="-0.1">
    <tspan x="315" dy="0">Gjennom web — åpnes i</tspan>
    <tspan x="315" dy="27">nettleseren på mange typer</tspan>
    <tspan x="315" dy="27">enheter.</tspan>
  </text>

  <!-- PNG/file mark. -->
  <g transform="translate(680 870)" stroke="#1d1d1b" stroke-width="5" stroke-linejoin="round">
    <path d="M0 16a16 16 0 0 1 16-16h35l27 27v74H0Z" fill="#f5f1e8"/>
    <path d="M51 0v28h27" fill="#f2c94c"/>
    <circle cx="28" cy="43" r="8" fill="#f2c94c"/>
    <path d="M10 83 31 61l13 12 11-11 18 21Z" fill="#1d1d1b"/>
  </g>
  <text x="791" y="888" class="sans ink" font-size="23" font-weight="800" letter-spacing="1.1">ELDRE ENHET?</text>
  <text x="791" y="924" class="sans muted" font-size="21" letter-spacing="-0.1">
    <tspan x="791" dy="0">Unngå JavaScript og</tspan>
    <tspan x="791" dy="27">last inn et statisk .png-bilde.</tspan>
  </text>

  <rect x="1087" y="889" width="346" height="62" rx="31" fill="#f2c94c"/>
  <text x="1260" y="915" class="sans ink" font-size="17" font-weight="800" letter-spacing="0.3" text-anchor="middle">AVREISE</text>
  <text x="1260" y="937" class="sans ink" font-size="13" font-weight="800" letter-spacing="0.25" text-anchor="middle">WEATHER SIGNAGE PROJECT</text>
</svg>
