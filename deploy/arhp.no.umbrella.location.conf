# Include this file inside the existing HTTPS server block for arhp.no.
# It intentionally does not define a new server block or replace the current
# arhp.no site. Confirm the existing block before enabling it.

location = /umbrella {
    return 301 /umbrella/;
}

location ^~ /umbrella/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    # Permissions Policy is intersected when a response contains more than
    # one policy. Hide an inherited site-wide restrictive header and emit one
    # unambiguous policy for this app, otherwise browser location can remain
    # blocked even when the site permission is set to Allow.
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Feature-Policy;
    add_header Permissions-Policy "geolocation=(self)" always;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
}
